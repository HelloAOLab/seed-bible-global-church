# reader-web on the faithnet estate — a Worker with static assets (the same shape as bible.faithnet.io).
# Build FIRST (`pnpm deploy:faithnet` does): a bare `wrangler deploy` ships whatever stale dist/ holds.
name = "seed-bible-reader-web"
compatibility_date = "2026-05-19"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.faithnet]
name = "seed-bible-reader-web-faithnet"
workers_dev = true

[[env.faithnet.routes]]
pattern = "seed-reader.faithnet.io"
custom_domain = true

[env.faithnet.assets]
directory = "./dist"
not_found_handling = "single-page-application"
