# reader-web on the faithnet estate — a Worker in front of static assets (the same shape as bible.faithnet.io).
# The Worker renders a chapter URL on the edge (worker/index.ts); every other path is the asset the build emitted.
# Build FIRST (`pnpm deploy:faithnet` does): a bare `wrangler deploy` ships whatever stale dist/ holds.
name = "seed-bible-reader-web"
main = "worker/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/read/*", "/shared/*", "/sitemap.xml", "/robots.txt", "/af/*", "/am/*", "/ar/*", "/az/*", "/be/*", "/bg/*", "/bn/*", "/bs/*", "/ca/*", "/cs/*", "/cy/*", "/da/*", "/de/*", "/el/*", "/en/*", "/es/*", "/et/*", "/fa/*", "/fi/*", "/fil/*", "/fr/*", "/fy/*", "/gl/*", "/gn/*", "/gu/*", "/he/*", "/hi/*", "/hr/*", "/hu/*", "/ind/*", "/is/*", "/it/*", "/iw/*", "/ja/*", "/ka/*", "/km/*", "/kn/*", "/ko/*", "/ky/*", "/ln/*", "/lo/*", "/lt/*", "/lv/*", "/mk/*", "/mn/*", "/ml/*", "/mr/*", "/ms/*", "/my/*", "/nb/*", "/ne/*", "/nl/*", "/no/*", "/pa/*", "/pl/*", "/ps/*", "/pt/*", "/ro/*", "/ru/*", "/sk/*", "/sl/*", "/sq/*", "/sv/*", "/sw/*", "/ta/*", "/te/*", "/th/*", "/ti/*", "/tl/*", "/tr/*", "/ug/*", "/uk/*", "/ur/*", "/uz/*", "/vi/*", "/zh/*", "/zu/*"]

[env.faithnet]
name = "seed-bible-reader-web-faithnet"
workers_dev = true

[env.faithnet.vars]
A2A_BASE = "https://seed-reader-a2a.faithnet.io"

[[env.faithnet.routes]]
pattern = "seed-reader.faithnet.io"
custom_domain = true

[env.faithnet.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/read/*", "/shared/*", "/sitemap.xml", "/robots.txt", "/af/*", "/am/*", "/ar/*", "/az/*", "/be/*", "/bg/*", "/bn/*", "/bs/*", "/ca/*", "/cs/*", "/cy/*", "/da/*", "/de/*", "/el/*", "/en/*", "/es/*", "/et/*", "/fa/*", "/fi/*", "/fil/*", "/fr/*", "/fy/*", "/gl/*", "/gn/*", "/gu/*", "/he/*", "/hi/*", "/hr/*", "/hu/*", "/ind/*", "/is/*", "/it/*", "/iw/*", "/ja/*", "/ka/*", "/km/*", "/kn/*", "/ko/*", "/ky/*", "/ln/*", "/lo/*", "/lt/*", "/lv/*", "/mk/*", "/mn/*", "/ml/*", "/mr/*", "/ms/*", "/my/*", "/nb/*", "/ne/*", "/nl/*", "/no/*", "/pa/*", "/pl/*", "/ps/*", "/pt/*", "/ro/*", "/ru/*", "/sk/*", "/sl/*", "/sq/*", "/sv/*", "/sw/*", "/ta/*", "/te/*", "/th/*", "/ti/*", "/tl/*", "/tr/*", "/ug/*", "/uk/*", "/ur/*", "/uz/*", "/vi/*", "/zh/*", "/zu/*"]
